name: Build Betano Reader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'betano-reader/**'
      - '.github/workflows/build-betano-reader.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: betano-reader
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Analizador-Betano-Prueba
          path: betano-reader/app/build/outputs/apk/debug/app-debug.apk
