name: Build Betano Reader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'betano-reader/**'
      - '.github/workflows/build-betano-reader.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: betano-reader
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Analizador-Betano-Prueba
          path: betano-reader/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK
        run: |
          mkdir -p downloads
          cp betano-reader/app/build/outputs/apk/debug/app-debug.apk downloads/Analizador-Betano-Prueba.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Analizador-Betano-Prueba.apk
          git commit -m "Publish latest Betano analyzer APK" || exit 0
          git push
